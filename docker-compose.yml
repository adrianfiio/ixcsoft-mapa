# Produção no EasyPanel
# PostgreSQL/PostGIS e Redis devem existir como serviços separados no mesmo projeto.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["web"]
    environment:
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
      WAIT_FOR_POSTGRES: "true"
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health/ready/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["worker"]
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["beat"]
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"

volumes:
  static_data:
  media_data:
