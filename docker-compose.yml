# Produção no Debian 13 / EasyPanel
# PostgreSQL/PostGIS e Redis são serviços externos a este arquivo.

x-common-environment: &common-environment
  APP_NAME: ${APP_NAME:-AFService Map}
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-0.10.2}
  WEB_URL: ${WEB_URL:-}
  PORT: ${PORT:-8000}
  TZ: ${TZ:-America/Sao_Paulo}

  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}

  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-ixcsoft_mapa}
  POSTGRES_USER: ${POSTGRES_USER:-ixcsoft}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  REDIS_URL: ${REDIS_URL}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
      WAIT_FOR_POSTGRES: "true"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error -H 'Host: localhost' http://127.0.0.1:8000/api/health/ready/ || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"
    networks:
      - default

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["beat"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"
    networks:
      - default

volumes:
  media_data:
