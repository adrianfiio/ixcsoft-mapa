# Produção no Debian 13 / EasyPanel
# PostgreSQL/PostGIS e Redis são serviços externos a este arquivo.

x-common-environment: &common-environment
  APP_NAME: ${APP_NAME:-AFService Map}
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-0.73.1}
  WEB_URL: ${WEB_URL:-}
  PORT: ${PORT:-8000}
  TZ: ${TZ:-America/Sao_Paulo}

  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}

  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-ixcsoft_mapa}
  POSTGRES_USER: ${POSTGRES_USER:-ixcsoft}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  REDIS_URL: ${REDIS_URL}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}

  # Monitoramento SNMP (Telegraf/InfluxDB, stack separada deste
  # docker-compose) — só o worker realmente usa isso.
  INFLUXDB_URL: ${INFLUXDB_URL:-http://monitor-influxdb:8086}
  INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
  INFLUXDB_ORG: ${INFLUXDB_ORG:-AFService}
  INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-mapa_metrics}
  SNMP_TELEGRAF_CONTAINER: ${SNMP_TELEGRAF_CONTAINER:-monitor-telegraf}
  SNMP_STATUS_POLL_SECONDS: ${SNMP_STATUS_POLL_SECONDS:-30}
  SNMP_STATUS_STALE_SECONDS: ${SNMP_STATUS_STALE_SECONDS:-180}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
      WAIT_FOR_POSTGRES: "true"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error -H 'Host: localhost' http://127.0.0.1:8000/api/health/ready/ || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"
    # Único container com acesso ao socket do Docker do host — necessário
    # pra recarregar o Telegraf (SIGHUP) quando um equipamento SNMP é
    # cadastrado/editado. NUNCA monte isso no `web` (fica exposto a
    # requisições HTTP direto da internet). Isso dá ao worker controle
    # sobre o Docker do host; se o GID do socket no servidor não for 999,
    # ajuste `group_add` para o GID real (rode `stat -c '%g' /var/run/docker.sock`).
    group_add:
      - "999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./equipamentos_ativos_snmp:/app/equipamentos_ativos_snmp
    networks:
      - default

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["beat"]
    environment:
      <<: *common-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      WAIT_FOR_POSTGRES: "true"
    networks:
      - default

volumes:
  media_data:
