<dialog id="kmz-import-dialog" class="editor-dialog kmz-import-dialog">
  <form id="kmz-import-form">
    <header>
      <div><h2>Assistente de importação KML/KMZ</h2><p class="help-text">Analise, revise, visualize no mapa e só então grave.</p></div>
      <button class="dialog-close" type="button">×</button>
    </header>
    <div class="dialog-body">
      <nav class="kmz-steps" aria-label="Etapas">
        <button type="button" data-step="1">1. Arquivo</button><button type="button" data-step="2">2. Cabos</button>
        <button type="button" data-step="3">3. Pontos</button><button type="button" data-step="4">4. Rotas</button>
        <button type="button" data-step="5">5. Prévia</button><button type="button" data-step="6">6. Importar</button>
      </nav>
      <div id="kmz-import-status" class="editor-message"></div>
      <section id="kmz-import-content"></section>
      <footer class="kmz-actions">
        <button id="kmz-back" class="secondary-button" type="button">Voltar</button>
        <button id="kmz-next" class="primary-button" type="button">Continuar</button>
        <button id="kmz-execute" class="primary-button" type="button" hidden>Importar definitivamente</button>
      </footer>
    </div>
  </form>
</dialog>
