{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | AFService Map{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/png" href="{% static 'img/afservice-map-favicon.png' %}">
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block branding %}
<div style="display:flex;align-items:center;gap:14px">
    <a href="{% url 'admin:index' %}" style="display:flex;text-decoration:none">
        <img
            src="{% static 'img/afservice-logo.png' %}"
            alt="AFService"
            style="width:145px;height:48px;object-fit:contain;object-position:left center"
        >
    </a>
</div>
{% endblock %}

{% block nav-global %}
<nav class="af-admin-shortcuts" aria-label="Atalhos administrativos">
    <a href="{% url 'dashboard' %}">Visão geral</a>
    <a href="{% url 'map' %}">Mapa operacional</a>
    <a href="{% url 'admin:network_map_networkproject_changelist' %}">Projetos</a>
    <a href="{% url 'admin:network_map_pop_changelist' %}">CPDs</a>
    <a href="{% url 'admin:olt_integration_olt_changelist' %}">OLTs</a>
    <a href="{% url 'admin:optical_dio_changelist' %}">DIOs</a>
</nav>
{% endblock %}
