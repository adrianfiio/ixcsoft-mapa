{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | AFService Map{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/png" href="{% static 'img/afservice-map-favicon.png' %}">
{% endblock %}

{% block branding %}
<div style="display:flex;align-items:center;gap:14px">
    <a href="{% url 'admin:index' %}" style="display:flex;text-decoration:none">
        <img
            src="{% static 'img/afservice-logo.png' %}"
            alt="AFService"
            style="width:145px;height:48px;object-fit:contain;object-position:left center"
        >
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
